name: Bug report
description: Something in Aperture is broken.
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What's broken
      description: What happened, and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Numbered steps, from a fresh page load if relevant.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: What must be true for this to count as fixed. Be concrete — this is what an AI agent will build against.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true

  - type: textarea
    id: files
    attributes:
      label: Files likely involved
      description: Paths or components, if known. Leave blank if unknown — a triager will fill this in.
    validations:
      required: false

  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: Explicitly call out anything adjacent that should NOT be touched by this fix.
    validations:
      required: false
