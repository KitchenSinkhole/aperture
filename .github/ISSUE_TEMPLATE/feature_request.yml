name: Feature request
description: Propose a new capability or change to Aperture.
labels: ["enhancement"]
body:
  - type: textarea
    id: description
    attributes:
      label: What and why
      description: What the feature does, and the problem it solves.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: What must be true for this to count as done. Be concrete — this is what an AI agent will build against.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true

  - type: textarea
    id: files
    attributes:
      label: Files likely involved
      description: Paths or components, if known. Leave blank if unknown — a triager will fill this in.
    validations:
      required: false

  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: Explicitly call out anything adjacent that should NOT be part of this change.
    validations:
      required: false
